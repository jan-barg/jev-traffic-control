name: Deploy traffic viewer to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "viewer/dist/**"
      - "tests/check_viewer.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check viewer and recorded comparisons
        run: |
          node --check viewer/dist/app.js
          node tests/check_viewer.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static viewer
        uses: actions/upload-pages-artifact@v4
        with:
          path: viewer/dist
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
